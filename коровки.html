<!DOCTYPE html>
<html lang="ru" style="overflow:hidden">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Милые коровки</title>
    <style>
        #container {
            position: relative;
            width: 100%;
        }
        .object {
            position: absolute;
            transition: transform 0.2s linear(0 0%, 0.82 12.23%, 1 100%);
            cursor: grab;
            -webkit-touch-callout: none;
	        -webkit-user-select: none;
	        -khtml-user-select: none;
	        -moz-user-select: none;
	        -ms-user-select: none;
	        user-select: none;

        }
        .object.flipped {
            transform: scaleX(-1);
            -webkit-touch-callout: none;
	        -webkit-user-select: none;
	        -khtml-user-select: none;
	        -moz-user-select: none;
	        -ms-user-select: none;
	        user-select: none;
        }

        img {
            max-width: 100px;
            max-height: 100px;
        }

        .object:active {
            cursor: grabbing;
        }
        button {
    background-color: green;
    color: white;
    border: 2px solid green;
    width: 180px; 
    height: 50px;
    font-size: 20px;
    -webkit-touch-callout: none;
	-webkit-user-select: none;
	-khtml-user-select: none;
	-moz-user-select: none;
	-ms-user-select: none;
	user-select: none;
}
    </style>
</head>
<body style="background-image: url('images/grass.gif');">
<div id="container"></div>

<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(100px, 1fr)); gap: 10px; justify-items: center;">
  <button onclick="addObject()" >Позвать коровку</button>
  <button onclick="removeAllObjects()" >Отправить всех коровок спать</button>
</div>


<script>
    const imageFiles = [
        "cow0.gif", "cow1.gif", "cow2.gif"
    ];

    function addObject() {
        const img = document.createElement('img');
        const randomIndex = Math.floor(Math.random() * imageFiles.length);
        const imagePath = 'images/' + imageFiles[randomIndex];
        img.src = imagePath;
        img.onload = () => {
            img.classList.add('object');
            img.style.top = Math.random() * (window.innerHeight - 100) + 'px';
            img.style.left = Math.random() * (window.innerWidth - 100) + 'px';
            document.getElementById('container').appendChild(img);
            moveObject(img);
            makeDraggable(img);
        };
    }

    function moveObject(obj) {
        let xDirection = 0;
        let yDirection = 0;
        setInterval(() => {
            const direction = Math.floor(Math.random() * 4);
            let top = parseInt(obj.style.top) || 0;
            let left = parseInt(obj.style.left) || 0;
            const speed = 40; // уменьшена скорость для лучшей видимости
            switch (direction) {
                case 0: top -= speed; yDirection = 1; break;
                case 1: top += speed; yDirection = -1; break;
                case 2: left -= speed; xDirection = 1; break;
                case 3: left += speed; xDirection = -1; break;
            }
            const maxWidth = 100;
            const maxHeight = 100;
            obj.style.top = Math.max(0, Math.min(top, window.innerHeight - maxHeight)) + 'px';
            obj.style.left = Math.max(0, Math.min(left, window.innerWidth - maxWidth)) + 'px';

            if (xDirection === -1) {
                obj.classList.add('flipped');
            }
            else {if (xDirection === 1) {
                obj.classList.remove('flipped');
            }}
        }, 1200); //Изменена частота анимации на 100 мс
    }

    function removeAllObjects() {
        document.getElementById('container').innerHTML = '';
    }


function makeDraggable(element) {
    let pos3 = 0, pos4 = 0;

    element.addEventListener('mousedown', dragMouseDown);

    function dragMouseDown(e) {
        e.preventDefault();
        pos3 = e.clientX;
        pos4 = e.clientY;
        document.addEventListener('mouseup', closeDragElement);
        document.addEventListener('mousemove', elementDrag);
    }

    function elementDrag(e) {
        e.preventDefault();
        const pos1 = pos3 - e.clientX;
        const pos2 = pos4 - e.clientY;
        pos3 = e.clientX;
        pos4 = e.clientY;

        const newTop = element.offsetTop - pos2;
        const newLeft = element.offsetLeft - pos1;

        // Ограничение перемещения
        const maxWidth = element.offsetWidth;
        const maxHeight = element.offsetHeight;
        const constrainedTop = Math.max(0, Math.min(newTop, window.innerHeight - maxHeight));
        const constrainedLeft = Math.max(0, Math.min(newLeft, window.innerWidth - maxWidth));

        element.style.top = constrainedTop + "px";
        element.style.left = constrainedLeft + "px";
    }

    function closeDragElement() {
        document.removeEventListener('mouseup', closeDragElement);
        document.removeEventListener('mousemove', elementDrag);


        }


    let isDragging = false;
    let offsetX, offsetY;

    element.addEventListener('touchstart', (e) => {
        isDragging = true;
        const touch = e.touches[0]; // Получаем координаты первого касания
        offsetX = touch.clientX - element.offsetLeft;
        offsetY = touch.clientY - element.offsetTop;
    });

    document.addEventListener('touchend', () => {
        isDragging = false;
    });

    document.addEventListener('touchmove', (e) => {
        if (isDragging) {
            e.preventDefault(); // Предотвращаем стандартное поведение прокрутки
            const touch = e.touches[0]; // Получаем координаты первого касания
            let x = touch.clientX - offsetX;
            let y = touch.clientY - offsetY;
            element.style.left = Math.max(0, Math.min(x, window.innerWidth - 100)) + 'px';
            element.style.top = Math.max(0, Math.min(y, window.innerHeight - 100)) + 'px';
        }
    });
    }

</script>

</body>
</html>
